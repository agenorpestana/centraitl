<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#10b981" stroke-width="4" opacity="0.2"/>
  <circle cx="256" cy="230" r="140" fill="#064e3b" opacity="0.3"/>

  <!-- Security Shield & Camera -->
  <g transform="translate(0, -10)">
    <!-- Camera Mount Wall Bracket -->
    <path d="M 120 180 L 170 180 L 170 210 L 120 210 Z" fill="#334155"/>
    <path d="M 140 150 L 160 150 L 160 240 L 140 240 Z" fill="#1e293b"/>

    <!-- Camera Body -->
    <path d="M 170 180 L 320 140 C 340 135, 360 150, 360 170 L 360 240 C 360 260, 340 275, 320 270 L 170 230 Z" fill="url(#emeraldGrad)"/>
    <path d="M 170 180 L 320 140 L 320 270 L 170 230 Z" fill="#10b981" opacity="0.8"/>

    <!-- Lens Front Glass -->
    <ellipse cx="360" cy="205" rx="20" ry="50" fill="#020617" stroke="#34d399" stroke-width="6"/>
    <ellipse cx="360" cy="205" rx="12" ry="32" fill="#065f46"/>
    <ellipse cx="360" cy="205" rx="6" ry="16" fill="#a7f3d0" filter="url(#glow)"/>

    <!-- IR LED Dots -->
    <circle cx="348" cy="175" r="4" fill="#34d399"/>
    <circle cx="348" cy="235" r="4" fill="#34d399"/>
    <circle cx="368" cy="175" r="4" fill="#34d399"/>
    <circle cx="368" cy="235" r="4" fill="#34d399"/>

    <!-- Sun Shield / Hood -->
    <path d="M 160 175 L 375 125 L 380 140 L 160 190 Z" fill="#f8fafc"/>

    <!-- Red Recording LED Dot -->
    <circle cx="210" cy="195" r="6" fill="#ef4444" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Central ITL Brand Text -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="4">
    CENTRAL <tspan fill="#34d399">ITL</tspan>
  </text>
  <text x="256" y="452" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#94a3b8" letter-spacing="6">
    MONITORAMENTO 24H
  </text>
</svg>
